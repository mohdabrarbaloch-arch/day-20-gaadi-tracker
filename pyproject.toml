[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI idiom `Depends()` in argument defaults — intentional
# E402: conftest sets env vars before importing the app — intentional
# SIM115: test fixture temp file
# RUF007: zip() pairs are clearer here than itertools.pairwise
ignore = ["B008", "E402", "SIM115", "RUF007"]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
